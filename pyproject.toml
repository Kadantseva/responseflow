[project]
name = "responseflow-local"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.2.4",
    "typer>=0.12,<1",
]

[project.scripts]
responseflow-local = "responseflow_local:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
